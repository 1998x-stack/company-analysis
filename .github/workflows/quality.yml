name: Quality Gate
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (preserve archive symlinks)
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install schema validator
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate JSON
        run: python3 -m json.tool docs/companies.json > /dev/null
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Frontend tests
        run: node --test tests/frontend.test.mjs
      - name: Repository audit (no new warnings allowed)
        run: python3 tools/audit_repository.py --baseline docs/audit_warning_baseline.json
      - name: Build legacy backfill and reproducibility ledgers
        run: |
          mkdir -p build
          python3 tools/backfill_evidence.py --output build/legacy_evidence_manifest.json
          python3 tools/reproduce_scores.py --output build/legacy_score_reproduction.json
      - name: Upload research quality ledgers
        uses: actions/upload-artifact@v4
        with:
          name: research-quality-ledgers
          path: build/*.json
          retention-days: 30
